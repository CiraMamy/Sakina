version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    container_name: sakina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sakina_dev
      POSTGRES_USER: sakina
      POSTGRES_PASSWORD: sakina
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sakina-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
